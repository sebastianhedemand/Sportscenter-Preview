name: Publish Sportscenter preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build preview
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp README.md _site/README.md
          cp -R docs _site/docs
          cp -R scripts _site/scripts
          cp -R tests _site/tests
          cp fodboldcenter_supabase_setup.sql _site/
          cp sportscenter_analytics_schema.sql _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
